name: Deploy Infrastructure to STG with Terraform

on:
  push:
    branches:
      - develop

#defaults:
#  run:
#    working-directory: infra

env:
  TF_VAR_env: "stg"
      
jobs:
  terraform:
    name: Setup Terraform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: sa-east-1

    - name: 🐍 Instalar Python e pip
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: 💾 Instalar dependências Python do build
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    - name: 🔧 Executar build da Lambda
      run: |
        chmod +x build_lambda.sh
        ./build_lambda.sh

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Set redeploy token
      run: echo "REDEPLOY_TOKEN=$(date +%s)-${GITHUB_SHA}" >> $GITHUB_ENV
         
    - name: Terraform fmt
      id: fmt
      run: terraform fmt -check
      continue-on-error: true
      working-directory: infra

    - name: Terraform Init
      run: terraform init
      working-directory: infra

    - name: Terraform PLAN
      run: terraform plan
      working-directory: infra
      env:
        REDEPLOY_TOKEN: ${{ env.REDEPLOY_TOKEN }} 

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: infra
      env:
        REDEPLOY_TOKEN: ${{ env.REDEPLOY_TOKEN }} 
